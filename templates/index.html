<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Proxy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .weather-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            border-radius: 15px;
            padding: 25px;
            display: none;
        }

        .weather-card.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .weather-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .city-name {
            font-size: 1.5rem;
            color: #333;
            font-weight: 600;
        }

        .country {
            color: #666;
            font-size: 0.9rem;
        }

        .temperature {
            text-align: center;
            font-size: 4rem;
            font-weight: 300;
            color: #333;
            margin: 20px 0;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-label {
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            color: #333;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .cache-badge {
            text-align: center;
            margin-top: 15px;
        }

        .cache-badge span {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cached {
            background: #e3f2fd;
            color: #1976d2;
        }

        .fresh {
            background: #e8f5e9;
            color: #388e3c;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .error-message.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .coordinates {
            text-align: center;
            color: #999;
            font-size: 0.75rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather Proxy</h1>
        <p class="subtitle">Enter a city name to get current weather</p>

        <form class="search-form" id="weatherForm">
            <input
                type="text"
                class="search-input"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
                required
            >
            <button type="submit" class="search-btn" id="searchBtn">Search</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Fetching weather data...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="weather-card" id="weatherCard">
            <div class="weather-header">
                <div class="city-name" id="cityName"></div>
                <div class="country" id="country"></div>
                <div class="coordinates" id="coordinates"></div>
            </div>

            <div class="temperature" id="temperature"></div>

            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
            </div>

            <div class="cache-badge">
                <span id="cacheBadge"></span>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('weatherForm');
        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const weatherCard = document.getElementById('weatherCard');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const city = cityInput.value.trim();
            if (!city) return;

            // Hide previous results
            weatherCard.classList.remove('visible');
            errorMessage.classList.remove('visible');

            // Show loading
            loading.classList.add('visible');
            searchBtn.disabled = true;

            try {
                const response = await fetch(`/weather?city=${encodeURIComponent(city)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.detail || 'Failed to fetch weather');
                }

                // Update weather card
                document.getElementById('cityName').textContent = data.city;
                document.getElementById('country').textContent = data.country;
                document.getElementById('coordinates').textContent =
                    `${data.latitude.toFixed(2)}°, ${data.longitude.toFixed(2)}°`;
                document.getElementById('temperature').textContent =
                    `${Math.round(data.temperature)}${data.temperature_unit}`;
                document.getElementById('humidity').textContent =
                    data.humidity ? `${data.humidity}${data.humidity_unit}` : 'N/A';
                document.getElementById('windSpeed').textContent =
                    data.wind_speed ? `${data.wind_speed} ${data.wind_speed_unit}` : 'N/A';

                const cacheBadge = document.getElementById('cacheBadge');
                if (data.cached) {
                    cacheBadge.textContent = 'Cached';
                    cacheBadge.className = 'cached';
                } else {
                    cacheBadge.textContent = 'Fresh Data';
                    cacheBadge.className = 'fresh';
                }

                weatherCard.classList.add('visible');

            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.classList.add('visible');
            } finally {
                loading.classList.remove('visible');
                searchBtn.disabled = false;
            }
        });

        // Focus input on load
        cityInput.focus();
    </script>
</body>
</html>
